services:
  redis:
    image: redis:8.8.0
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10

  pgvector:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: "passwd"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6334:6333"
      - "6335:6334"
    healthcheck:
      # The qdrant image ships neither curl nor wget; it does have bash, so use a
      # /dev/tcp connect check against the REST port to confirm readiness.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 2s
      timeout: 5s
      retries: 15

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    environment:
      ELASTIC_PASSWORD: "passwd"
      discovery.type: "single-node"
      xpack.security.enabled: "false"
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 2s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2Gb

  weaviate:
    image: semitechnologies/weaviate:1.38.2
    environment:
      QUERY_DEFAULTS_LIMIT: "100"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    ports:
      - "8081:8080"
      # gRPC search port (the engine's default query path); exposed so the
      # gRPC path is reachable when benchmarking/testing against this service.
      - "50051:50051"
    healthcheck:
      # The weaviate image has no curl; use its bundled wget in spider mode to
      # probe the readiness endpoint.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 2s
      timeout: 5s
      retries: 15

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.6.13
    environment:
      ETCD_AUTO_COMPACTION_MODE: "revision"
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 10s
      retries: 10

  milvus-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.6.19
    environment:
      ETCD_ENDPOINTS: "milvus-etcd:2379"
      MINIO_ADDRESS: "milvus-minio:9000"
    command: ["milvus", "run", "standalone"]
    ports:
      - "19531:19530"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/healthz || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 4Gb

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    environment:
      discovery.type: "single-node"
      # DISABLE_SECURITY_PLUGIN skips the security demo installer entirely; the
      # older plugins.security.disabled flag does not, so the installer still ran
      # and rejected the (weak) admin password, crashing the container on startup.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9202:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 2s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2Gb

  mongodb-search:
    image: mongodb/mongodb-atlas-local:8.0.17
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 30

  valkey:
    image: valkey/valkey-bundle:latest
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    # Dragonfly requires the ability to lock memory; disable the memlock limit.
    ulimits:
      memlock: -1
    ports:
      - "6385:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10

  kividb:
    image: quay.io/kividbio/kividb:v1.0.2-full
    # KiviDB listens on 6380 internally (not 6379). The image ships no
    # redis-cli/valkey-cli, but it does include bash, so the healthcheck opens
    # a raw TCP connection to the server port to confirm readiness.
    ports:
      - "6386:6380"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6380"]
      interval: 1s
      timeout: 3s
      retries: 15

  chroma:
    image: chromadb/chroma:1.0.0
    environment:
      ANONYMIZED_TELEMETRY: "False"
    ports:
      - "8003:8000"
    # The Chroma image is minimal (no curl/wget/python for a shell healthcheck)
    # and ships no built-in HEALTHCHECK, so `up --wait` only waits for the
    # container to be running; the integration test's wait_for_chroma() polls
    # /api/v2/heartbeat (60s deadline) for actual readiness.
