name: Docker Publish - Release

# Builds and pushes redis/vector-db-benchmark:<version> (and :latest for a
# final release) when a release is published.
#
# workflow_dispatch publishes an EXISTING published release whose own run
# failed: "Re-run" would replay the tag's own (possibly broken) copy of this
# workflow, so dispatch this file from master with `tag=<tag>` instead. The
# build context is the tag's commit, and the image tags are exactly the ones a
# release event for that tag produces.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published (non-draft) release tag to build and push, e.g. 0.2.0
        required: true
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: redis/vector-db-benchmark

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      # Resolves the tag, its commit and the docker/metadata-action tag rules.
      # A release event keeps metadata-action's own rules. A dispatch replicates
      # them with type=raw, because there github.ref is the branch, not the tag.
      # For metadata-action v5 on a release event (ref refs/tags/<tag>):
      #   type=semver,pattern={{version}} -> <tag> without a leading "v"; it is
      #     processed first (priority 900 > 600) and so decides `latest`
      #     (flavor latest=auto): true for X.Y.Z, false for a prerelease.
      #   type=ref,event=tag              -> <tag> verbatim (deduplicated when
      #     it equals the semver value).
      # So 0.2.0 -> 0.2.0, latest; v0.2.0 -> 0.2.0, v0.2.0, latest;
      # 0.2.0-rc.1 -> 0.2.0-rc.1 only.
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            release)
              tag="$RELEASE_TAG"
              sha="$GITHUB_SHA"
              rules=$'type=ref,event=tag\ntype=semver,pattern={{version}}'
              ;;
            workflow_dispatch)
              tag="$INPUT_TAG"
              if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
                echo "::error::invalid tag '$tag' (expected X.Y.Z, vX.Y.Z or X.Y.Z-rc.N)"
                exit 1
              fi
              if ! info="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json tagName,isDraft,publishedAt)"; then
                echo "::error::no published release for tag '$tag'"
                exit 1
              fi
              if [[ "$(jq -r .tagName <<<"$info")" != "$tag" ]] ||
                 [[ "$(jq -r .isDraft <<<"$info")" != "false" ]] ||
                 [[ "$(jq -r '.publishedAt // ""' <<<"$info")" == "" ]]; then
                echo "::error::release '$tag' is a draft or not published: $info"
                exit 1
              fi
              # The tag's COMMIT (an annotated tag resolves through to it).
              sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)"
              version="${tag#v}"
              rules="type=raw,value=$version"
              if [[ "$tag" != "$version" ]]; then
                rules+=$'\n'"type=raw,value=$tag"
              fi
              if [[ "$version" != *-* ]]; then
                rules+=$'\n'"type=raw,value=latest"
              fi
              ;;
            *)
              echo "::error::unexpected event $EVENT"
              exit 1
              ;;
          esac
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve a commit for '$tag'"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "rules<<VDB_EOF"
            echo "$rules"
            echo "VDB_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building \`$tag\` from \`$sha\` ($EVENT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Empty on a release event: the default, which is the release's tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', steps.release.outputs.tag) || '' }}

      - name: Verify the checkout is the tag's commit
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$EXPECTED_SHA" ]]; then
            echo "::error::checked out $head, expected $EXPECTED_SHA"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -z "$DOCKER_USERNAME" || -z "$DOCKER_PASSWORD" ]]; then
            echo "Docker Hub credentials not configured!"
            echo "Please set DOCKER_USERNAME and DOCKER_PASSWORD secrets in repository settings."
            exit 1
          fi
          echo "Docker Hub credentials are configured"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.release.outputs.rules }}
          # On a dispatch github.sha is master's head, not the tag's commit.
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The build context has no .git: name the commit for `--version` and
          # `params.build.git_sha` (#366). Declared after the dependency layer
          # in the Dockerfile, so it does not invalidate the cache.
          build-args: |
            VDB_BUILD_GIT_SHA=${{ steps.release.outputs.sha }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The scan is advisory: the image is already pushed, so a scanner failure
      # must not fail the run or skip the steps below. Its outcome is reported
      # in the summary. Pinned by SHA after the March 2026 trivy-action tag
      # hijack (GHSA-69fq-xp46-6x23): v0.36.0 is a post-incident, signed tag
      # on an immutable release. The Trivy binary is pinned too (>= v0.72.0
      # fixes GHSA-mcj4-mphf-j9ff, GHSA-8rc5-4fr6-64pw, GHSA-q3fv-x8vg-qqm4).
      - name: Run Trivy vulnerability scanner
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The manifest list that was just pushed, by digest.
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          version: 'v0.76.1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: redis/vector-db-benchmark
          readme-filepath: ./DOCKER_README.md

      - name: Generate summary
        if: always() && steps.build.outcome == 'success'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.docker_meta.outputs.version }}
          TAGS: ${{ steps.docker_meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Docker Release Published"
            echo ""
            echo "**Repository:** \`$IMAGE_NAME\`"
            echo "**Release:** \`$RELEASE_TAG\`"
            echo "**Digest:** \`$DIGEST\`"
            echo "**Tags:**"
            echo "\`\`\`"
            echo "$TAGS"
            echo "\`\`\`"
            echo ""
            echo "**Usage:**"
            echo "\`\`\`bash"
            echo "# Specific version"
            echo "docker run --rm $IMAGE_NAME:$VERSION --help"
            # A prerelease does not move :latest.
            if grep -qx "$IMAGE_NAME:latest" <<<"$TAGS"; then
              echo ""
              echo "# Latest release"
              echo "docker run --rm $IMAGE_NAME:latest --help"
            fi
            echo "\`\`\`"
            echo ""
            echo "**Trivy scan:** $TRIVY_OUTCOME"
            echo ""
            echo "[View on Docker Hub](https://hub.docker.com/r/redis/vector-db-benchmark)"
            echo "[Security Scan Results](https://github.com/$REPO/security/code-scanning)"
          } >> "$GITHUB_STEP_SUMMARY"
