name: Docker Publish - Release

# Builds and pushes redis/vector-db-benchmark:<version> to Docker Hub when a
# release is published, plus :latest when the tag is the repository's latest
# release. Missing DOCKER_USERNAME / DOCKER_PASSWORD secrets fail the run: a
# release with no image must be loud.
#
# workflow_dispatch publishes an EXISTING published release whose own run
# failed: "Re-run" would replay the tag's own (possibly broken) copy of this
# workflow, so dispatch this file from master with `tag=<tag>` instead. The
# build context is the tag's commit, and the image tags are the ones a release
# event for that tag produces.
#
# The vulnerability scan runs in a separate job that holds no registry
# credentials, after the push, and cannot fail the publish.
#
# Every action is pinned by full commit SHA (the March 2026 trivy-action tag
# hijack, GHSA-69fq-xp46-6x23, moved version tags to an infostealer).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published (non-draft) release tag to build and push, e.g. 0.2.0
        required: true
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: redis/vector-db-benchmark

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      # Resolves the tag, its commit and the docker/metadata-action tag rules.
      # A release event keeps metadata-action's own rules. A dispatch replicates
      # them with type=raw, because there github.ref is the branch, not the tag.
      # For metadata-action v5 on a release event (ref refs/tags/<tag>):
      #   type=semver,pattern={{version}} -> <tag> without a leading "v"
      #   type=ref,event=tag              -> <tag> verbatim (deduplicated when
      #                                      it equals the semver value)
      # `latest` is NOT left to metadata-action (flavor latest=false): its
      # latest=auto tags every final X.Y.Z, so a backport release, or a
      # dispatch of an older tag, would move :latest backwards. :latest is added
      # only for a final (no "-") tag that is the repository's latest release.
      # So, with 0.2.0 the latest release: 0.2.0 -> 0.2.0, latest;
      # v0.2.0 -> 0.2.0, v0.2.0, latest; 0.2.0-rc.1 -> 0.2.0-rc.1;
      # 0.1.0 -> 0.1.0 (and a ::warning::).
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            release)
              tag="$RELEASE_TAG"
              sha="$GITHUB_SHA"
              version="${tag#v}"
              rules=$'type=ref,event=tag\ntype=semver,pattern={{version}}'
              ;;
            workflow_dispatch)
              tag="$INPUT_TAG"
              if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
                echo "::error::invalid tag '$tag' (expected X.Y.Z, vX.Y.Z or X.Y.Z-rc.N)"
                exit 1
              fi
              if ! info="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json tagName,isDraft,publishedAt,targetCommitish)"; then
                echo "::error::no published release for tag '$tag'"
                exit 1
              fi
              if [[ "$(jq -r .tagName <<<"$info")" != "$tag" ]] ||
                 [[ "$(jq -r .isDraft <<<"$info")" != "false" ]] ||
                 [[ "$(jq -r '.publishedAt // ""' <<<"$info")" == "" ]]; then
                echo "::error::release '$tag' is a draft or not published: $info"
                exit 1
              fi
              # The tag's COMMIT (an annotated tag resolves through to it).
              sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)"
              # A release created from a commit records it: refuse a tag that
              # has since been moved to another commit.
              target="$(jq -r '.targetCommitish // ""' <<<"$info")"
              if [[ "$target" =~ ^[0-9a-f]{40}$ && "$target" != "$sha" ]]; then
                echo "::error::tag '$tag' is on $sha but its release was created at $target"
                exit 1
              fi
              version="${tag#v}"
              rules="type=raw,value=$version"
              if [[ "$tag" != "$version" ]]; then
                rules+=$'\n'"type=raw,value=$tag"
              fi
              ;;
            *)
              echo "::error::unexpected event $EVENT"
              exit 1
              ;;
          esac
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve a commit for '$tag'"
            exit 1
          fi
          # A prerelease version never gets :latest (as metadata-action's semver
          # rule). A final one only when it is the repository's latest release.
          latest=false
          if [[ "$version" != *-* ]]; then
            newest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)"
            if [[ "$tag" == "$newest" ]]; then
              latest=true
              rules+=$'\n'"type=raw,value=latest"
            else
              echo "::warning::'$tag' is not the latest release ('${newest:-none}'); not moving :latest"
            fi
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "latest=$latest"
            echo "rules<<VDB_EOF"
            echo "$rules"
            echo "VDB_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building \`$tag\` from \`$sha\` ($EVENT, latest: $latest)" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Empty on a release event: the default, which is the release's tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', steps.release.outputs.tag) || '' }}
          persist-credentials: false

      - name: Verify the checkout is the tag's commit
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$EXPECTED_SHA" ]]; then
            echo "::error::checked out $head, expected $EXPECTED_SHA"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Check Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -z "$DOCKER_USERNAME" || -z "$DOCKER_PASSWORD" ]]; then
            echo "::error::Docker Hub credentials not configured! Set the DOCKER_USERNAME and DOCKER_PASSWORD repository secrets, then dispatch this workflow from master with tag=<tag>."
            exit 1
          fi
          echo "Docker Hub credentials are configured"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: docker_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: ${{ steps.release.outputs.rules }}
          # On a dispatch github.sha is master's head, not the tag's commit.
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.source=https://github.com/redis/vector-db-benchmark

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The build context has no .git: name the commit for `--version` and
          # `params.build.git_sha` (#366). Declared after the dependency layer
          # in the Dockerfile, so it does not invalidate the cache.
          build-args: |
            VDB_BUILD_GIT_SHA=${{ steps.release.outputs.sha }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: redis/vector-db-benchmark
          readme-filepath: ./DOCKER_README.md

      - name: Generate summary
        if: always() && steps.build.outcome == 'success'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.docker_meta.outputs.version }}
          TAGS: ${{ steps.docker_meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          {
            echo "## Docker Release Published"
            echo ""
            echo "**Repository:** \`$IMAGE_NAME\`"
            echo "**Release:** \`$RELEASE_TAG\`"
            echo "**Digest:** \`$DIGEST\`"
            echo "**Tags:**"
            echo "\`\`\`"
            echo "$TAGS"
            echo "\`\`\`"
            echo ""
            echo "**Usage:**"
            echo "\`\`\`bash"
            echo "# Specific version"
            echo "docker run --rm $IMAGE_NAME:$VERSION --help"
            # Only a final release that is the repository's latest moves :latest.
            if [[ "$LATEST" == "true" ]]; then
              echo ""
              echo "# Latest release"
              echo "docker run --rm $IMAGE_NAME:latest --help"
            fi
            echo "\`\`\`"
            echo ""
            echo "[View on Docker Hub](https://hub.docker.com/r/redis/vector-db-benchmark)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Advisory scan of the pushed manifest list, by digest. The Docker Hub
  # repository is public, so this job pulls anonymously and holds no secrets;
  # it cannot fail the release (the image is already pushed).
  scan:
    needs: docker-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.docker-publish.outputs.sha }}
          persist-credentials: false

      # trivy-action v0.36.0: a post-incident, signed tag on an immutable
      # release. The Trivy binary is pinned too (>= v0.72.0 fixes
      # GHSA-mcj4-mphf-j9ff, GHSA-8rc5-4fr6-64pw, GHSA-q3fv-x8vg-qqm4).
      - name: Run Trivy vulnerability scanner
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.docker-publish.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          version: 'v0.76.1'

      # File the results under the release tag and its commit, not under
      # master (a dispatch's GITHUB_REF / GITHUB_SHA).
      - name: Upload Trivy scan results to GitHub Security tab
        id: sarif
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          ref: refs/tags/${{ needs.docker-publish.outputs.tag }}
          sha: ${{ needs.docker-publish.outputs.sha }}

      - name: Generate summary
        if: always()
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.docker-publish.outputs.digest }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          SARIF_OUTCOME: ${{ steps.sarif.outcome }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Trivy scan"
            echo ""
            echo "**Image:** \`$IMAGE_REF\`"
            echo "**Scan:** ${TRIVY_OUTCOME:-not run}"
            echo "**SARIF upload:** ${SARIF_OUTCOME:-skipped (no results file)}"
            echo ""
            echo "[Security Scan Results](https://github.com/$REPO/security/code-scanning)"
          } >> "$GITHUB_STEP_SUMMARY"
